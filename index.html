<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who Painted This? — An Art History Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --wall: #2E3328;
    --plaster: #F3ECDD;
    --ink: #211F1A;
    --ink-soft: #5B564A;
    --brass: #B8894F;
    --brass-light: #D6AE7B;
    --correct: #5B7553;
    --wrong: #9C4A3C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--wall);
    background-image:
      radial-gradient(ellipse at top, rgba(255,255,255,0.04), transparent 60%),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 1px, transparent 1px, transparent 120px);
    color: var(--plaster);
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
    overflow: hidden;
  }

  .layout{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 48px;
    max-width: 1100px;
    width:100%;
  }

  .left-col{
    flex: 1 1 420px;
    max-width: 460px;
    display:flex;
    flex-direction:column;
  }

  .right-col{
    flex: 0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  header{ margin-bottom: 18px; }
  h1{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(26px, 3.4vw, 38px);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .sub{ color: #C9C4B4; font-size: 14px; line-height: 1.5; margin:0; }

  .scorebar{ display:flex; gap: 28px; margin: 16px 0 20px; font-family:'Fraunces', serif; }
  .score-item{ text-align:left; }
  .score-num{ font-size: 28px; color: var(--brass-light); font-weight:600; display:block; line-height:1; }
  .score-label{ font-size: 11px; letter-spacing: 0.06em; color: #A9A490; display:block; margin-top: 4px; }

  .frame{
    background: linear-gradient(135deg, #C9A15E, #8A6A38 45%, #6B4E28);
    padding: 10px;
    border-radius: 3px;
    box-shadow: 0 14px 32px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.15);
    width: min(340px, 32vw);
  }
  .canvas-inner{ background: #12100D; padding: 6px; border-radius: 1px; }
  .art-img{
    width:100%;
    aspect-ratio: 4/5;
    max-height: 62vh;
    object-fit: cover;
    display:block;
    background: #40453A;
  }
  .art-fallback{
    width:100%;
    aspect-ratio: 4/5;
    max-height: 62vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(160deg, #565F4A, #3B4033);
    color: #E6DDC8;
    font-family:'Fraunces', serif;
    font-size: 15px;
    text-align:center;
    padding: 20px;
    line-height:1.4;
  }

  .prompt{
    font-family:'Fraunces', serif;
    font-size: 17px;
    font-style: italic;
    color: var(--brass-light);
    margin: 4px 0 14px;
    text-align:left;
  }

  .options{
    width:100%;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .option-btn{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size: 13px;
    background: var(--plaster);
    color: var(--ink);
    border: none;
    border-radius: 4px;
    padding: 12px 8px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.15s ease;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
  }
  .option-btn:hover:not(:disabled){ transform: translateY(-2px); background: #fff; }
  .option-btn:disabled{ cursor: default; }
  .option-btn.correct{ background: var(--correct); color: #fff; }
  .option-btn.wrong{ background: var(--wrong); color: #fff; }

  .result-bar{
    width:100%;
    margin-top: 16px;
    background: var(--plaster);
    color: var(--ink);
    border-radius: 4px;
    padding: 12px 16px;
    text-align:left;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    display:none;
  }
  .result-bar.show{ display:block; }
  .result-bar .verdict{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 14px;
    margin: 0 0 4px;
  }
  .result-bar .verdict.correct-text{ color: var(--correct); }
  .result-bar .verdict.wrong-text{ color: var(--wrong); }
  .result-bar .details{
    font-family:'Fraunces', serif;
    font-size: 15px;
    margin: 0;
  }
  .result-bar .year{ color: var(--brass); font-weight: 700; }
  .result-bar .location{
    font-size: 12px;
    color: var(--ink-soft);
    margin: 4px 0 0;
    font-style: italic;
  }
  .result-bar .info{
    font-size: 11px;
    color: var(--ink-soft);
    margin: 6px 0 0;
    line-height:1.4;
  }

  .continue-wrap{ margin-top: 14px; min-height: 20px; }
  button.next-btn{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size: 13px;
    background: var(--brass);
    color: #211F1A;
    border:none;
    padding: 10px 24px;
    border-radius: 3px;
    cursor:pointer;
    transition: background 0.15s ease;
  }
  button.next-btn:hover{ background: var(--brass-light); }

  footer{
    display:none;
  }

  .lang-switcher{
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 60;
    display:flex;
    gap: 4px;
    background: rgba(0,0,0,0.25);
    border-radius: 6px;
    padding: 4px;
  }
  .lang-btn{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size: 12px;
    background: transparent;
    color: #C9C4B4;
    border: none;
    border-radius: 4px;
    padding: 6px 12px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .lang-btn:hover{ color: #fff; }
  .lang-btn.active{
    background: var(--brass);
    color: #211F1A;
  }

  .milestone-overlay{
    position: fixed;
    left: 20px;
    bottom: 20px;
    z-index: 50;
    transform: translateY(140%);
    opacity: 0;
    transition: transform 0.8s ease-out, opacity 0.8s ease-out;
    pointer-events: none;
  }
  .milestone-overlay.show{
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }
  .milestone-overlay.exit{
    transform: translateY(-140%);
    opacity: 0;
    transition: transform 0.4s ease-in, opacity 0.4s ease-in;
    pointer-events: none;
  }
  .milestone-card{
    background: transparent;
    padding: 0;
    width: 220px;
    text-align:center;
  }
  .milestone-img{
    width: 100%;
    max-height: 220px;
    object-fit: contain;
    border-radius: 10px;
    display:block;
    margin-bottom: 10px;
    box-shadow: 0 14px 34px rgba(0,0,0,0.5);
  }
  .milestone-text{
    font-family:'Fraunces', serif;
    font-weight: 700;
    font-size: 16px;
    color: var(--plaster);
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    margin: 0 0 10px;
  }
  .milestone-card .next-btn{
    width: 100%;
    padding: 8px 10px;
    font-size: 12px;
  }

  @media (max-width: 820px){
    body{ height:auto; overflow:auto; padding: 28px 16px 48px; }
    .layout{ flex-direction: column; gap: 24px; }
    .left-col{ max-width: 420px; text-align:center; }
    .scorebar{ justify-content:center; }
    .score-item{ text-align:center; }
    .prompt{ text-align:center; }
    .frame{ width: min(320px, 78vw); }
    .art-img, .art-fallback{ max-height: none; }
  }
  @media (max-width: 480px){
    .options{ grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce){
    .option-btn{ transition:none; }
  }
</style>
</head>
<body>

<div class="lang-switcher" id="langSwitcher">
  <button class="lang-btn active" id="langEnBtn" data-lang="en">EN</button>
  <button class="lang-btn" id="langUaBtn" data-lang="ua">UA</button>
</div>

<div class="layout">
  <div class="right-col">
    <div class="frame">
      <div class="canvas-inner">
        <img class="art-img" id="artImg" src="" alt="" />
        <div class="art-fallback" id="artFallback" style="display:none;"></div>
      </div>
    </div>
  </div>

  <div class="left-col">
    <header>
      <h1 id="mainTitle">Who Painted This?</h1>
      <p class="sub" id="subText">One painting, four names. Pick the artist who made it.</p>
    </header>

    <div class="scorebar">
      <div class="score-item">
        <span class="score-num" id="streakNum">0</span>
        <span class="score-label" id="streakLabel">STREAK</span>
      </div>
      <div class="score-item">
        <span class="score-num" id="bestNum">0</span>
        <span class="score-label" id="bestLabel">BEST</span>
      </div>
    </div>


    <div class="options" id="options"></div>

    <div class="result-bar" id="resultBar">
      <p class="verdict" id="verdict"></p>
      <p class="details"><span id="rTitle"></span> — <span class="year" id="rYear"></span></p>
      <p class="info" id="rInfo"></p>
      <p class="location" id="rLocation"></p>
    </div>

    <div class="continue-wrap" id="continueWrap"></div>
  </div>
</div>

<div class="milestone-overlay" id="milestoneOverlay">
  <div class="milestone-card">
    <img id="milestoneImg" src="" alt="" class="milestone-img" />
    <p class="milestone-text" id="milestoneText"></p>
    <button class="next-btn" id="milestoneBtn"></button>
  </div>
</div>

<footer>
  Artwork years and details reflect widely documented art-historical records. Images are sourced from Wikipedia and stored locally in this project.
</footer>

let deck = [];
let currentArt = null;
let milestoneTimeoutId = null;
let currentLang = localStorage.getItem("wpt_lang") || "en";
let currentOptionButtons = [];
let lastContinueLabelKey = null;
let lastGuessCorrect = null;
let streak = parseInt(localStorage.getItem("wpt_streak") || "0", 10);
let best = parseInt(localStorage.getItem("wpt_best") || "0", 10);

function locArt(art, field){
  if(currentLang === "ua"){
    const idx = ARTWORKS.indexOf(art);
    return TRANSLATIONS.ua.artworks[idx][field];
  }
  return art[field];
}

function t(key){
  return TRANSLATIONS[currentLang].ui[key];
}

function applyStaticText(){
  document.getElementById("mainTitle").textContent = t("title");
  document.getElementById("subText").textContent = t("subtitle");
  document.getElementById("streakLabel").textContent = t("streakLabel");
  document.getElementById("bestLabel").textContent = t("bestLabel");
  document.querySelector("footer").textContent = t("footer");
  document.documentElement.lang = currentLang === "ua" ? "uk" : "en";
}

function setLanguage(lang){
  currentLang = lang;
  localStorage.setItem("wpt_lang", lang);
  document.getElementById("langEnBtn").classList.toggle("active", lang === "en");
  document.getElementById("langUaBtn").classList.toggle("active", lang === "ua");
  applyStaticText();

  // Relabel the current answer buttons without changing which painting is shown
  currentOptionButtons.forEach(({btn, art}) => {
    btn.textContent = locArt(art, "artist");
  });

  // If the image failed to load, refresh the fallback caption text
  const fallback = document.getElementById("artFallback");
  if(fallback.style.display !== "none" && currentArt){
    fallback.innerHTML = t("noImage") + "<br><span style=\"opacity:0.7;font-size:12px\">" + locArt(currentArt, "title") + "</span>";
  }
  const img = document.getElementById("artImg");
  if(img) img.alt = t("prompt");

  // If a result is currently showing, refresh its text too
  if(currentArt && lastGuessCorrect !== null){
    const verdict = document.getElementById("verdict");
    verdict.textContent = lastGuessCorrect ? t("correct") : t("incorrect");
    document.getElementById("rTitle").textContent = locArt(currentArt, "title");
    document.getElementById("rLocation").textContent = "📍 " + locArt(currentArt, "location");
    document.getElementById("rInfo").textContent = locArt(currentArt, "info");
  }

  // Refresh the continue button label if one is showing
  if(lastContinueLabelKey){
    const continueBtn = document.querySelector("#continueWrap .next-btn");
    if(continueBtn) continueBtn.textContent = t(lastContinueLabelKey);
  }
}

document.getElementById("langEnBtn").addEventListener("click", () => setLanguage("en"));
document.getElementById("langUaBtn").addEventListener("click", () => setLanguage("ua"));

document.getElementById("streakNum").textContent = streak;
document.getElementById("bestNum").textContent = best;

function shuffledDeck(){
  const d = [...ARTWORKS];
  for(let i = d.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [d[i], d[j]] = [d[j], d[i]];
  }
  return d;
}

function drawCard(){
  if(deck.length === 0) deck = shuffledDeck();
  let card = deck.pop();
  if(card === currentArt && deck.length > 0){
    // avoid an immediate repeat when a fresh shuffle starts with the last-seen card
    deck.unshift(card);
    card = deck.pop();
  }
  return card;
}

function pickOptions(correctArt){
  const others = ARTWORKS.filter(a => a.artist !== correctArt.artist);
  for(let i = others.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [others[i], others[j]] = [others[j], others[i]];
  }
  const distractors = others.slice(0, 3);
  const opts = [...distractors, correctArt];
  for(let i = opts.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [opts[i], opts[j]] = [opts[j], opts[i]];
  }
  return opts;
}

function startRound(){
  const thisRoundArt = drawCard();
  currentArt = thisRoundArt;
  const img = document.getElementById("artImg");
  const fallback = document.getElementById("artFallback");

  const opts = pickOptions(currentArt);
  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";
  currentOptionButtons = [];
  opts.forEach(art => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.textContent = locArt(art, "artist");
    btn.onclick = () => onGuess(art, btn);
    optionsDiv.appendChild(btn);
    currentOptionButtons.push({ btn, art });
  });

  lastContinueLabelKey = null;
  lastGuessCorrect = null;

  document.getElementById("resultBar").classList.remove("show");
  document.getElementById("continueWrap").innerHTML = "";

  img.onerror = function(){
    img.style.display = "none";
    fallback.style.display = "flex";
    fallback.innerHTML = t("noImage") + "<br><span style=\"opacity:0.7;font-size:12px\">" + locArt(thisRoundArt, "title") + "</span>";
  };
  img.onload = function(){
    img.style.display = "";
    fallback.style.display = "none";
  };
  img.alt = t("prompt");
  img.style.display = "";
  fallback.style.display = "none";
  img.src = thisRoundArt.image;
}

function onGuess(art, btnEl){
  const correct = art === currentArt;
  currentOptionButtons.forEach(({btn, art: a}) => {
    btn.disabled = true;
    if(a === currentArt) btn.classList.add("correct");
    else if(btn === btnEl && !correct) btn.classList.add("wrong");
  });

  if(correct){
    streak++;
    if(streak > best){
      best = streak;
      localStorage.setItem("wpt_best", best);
      document.getElementById("bestNum").textContent = best;
    }
  } else {
    streak = 0;
  }
  localStorage.setItem("wpt_streak", streak);
  document.getElementById("streakNum").textContent = streak;

  lastGuessCorrect = correct;

  const verdict = document.getElementById("verdict");
  verdict.textContent = correct ? t("correct") : t("incorrect");
  verdict.className = "verdict " + (correct ? "correct-text" : "wrong-text");
  document.getElementById("rTitle").textContent = locArt(currentArt, "title");
  document.getElementById("rYear").textContent = currentArt.year;
  document.getElementById("rLocation").textContent = "📍 " + locArt(currentArt, "location");
  document.getElementById("rInfo").textContent = locArt(currentArt, "info");
  document.getElementById("resultBar").classList.add("show");

  const btn = document.createElement("button");
  btn.className = "next-btn";
  document.getElementById("continueWrap").innerHTML = "";
  document.getElementById("continueWrap").appendChild(btn);

  if(correct && streak === 30){
    lastContinueLabelKey = "playAgain";
    btn.textContent = t("playAgain");
    btn.onclick = () => {
      streak = 0;
      localStorage.setItem("wpt_streak", streak);
      document.getElementById("streakNum").textContent = streak;
      hideMilestone();
      startRound();
    };
    showMilestone({
      image: "images/milestone-30-win.jpg",
      text: ""
    });
  } else if(correct && streak === 15){
    lastContinueLabelKey = "next";
    btn.textContent = t("next");
    btn.onclick = () => {
      hideMilestone();
      startRound();
    };
    showMilestone({
      image: "images/milestone-15.jpg",
      text: ""
    });
  } else {
    lastContinueLabelKey = "next";
    btn.textContent = t("next");
    btn.onclick = startRound;
  }
}

function showMilestone({image, text, buttonText, onClick, autoDismissMs}){
  const overlay = document.getElementById("milestoneOverlay");
  const img = document.getElementById("milestoneImg");
  const textEl = document.getElementById("milestoneText");
  const btnEl = document.getElementById("milestoneBtn");

  // Snap back to the hidden-below-screen position instantly (no transition),
  // so the next entrance always slides up from the bottom, not from wherever it exited to.
  overlay.style.transition = "none";
  overlay.classList.remove("show", "exit");
  void overlay.offsetWidth; // force reflow
  overlay.style.transition = "";

  img.src = image;
  img.alt = text || "Milestone reached";
  textEl.textContent = text;
  textEl.style.display = text ? "" : "none";

  if(autoDismissMs){
    btnEl.style.display = "none";
    milestoneTimeoutId = setTimeout(onClick, autoDismissMs);
  } else if(buttonText){
    btnEl.style.display = "";
    btnEl.textContent = buttonText;
    btnEl.onclick = onClick;
  } else {
    btnEl.style.display = "none";
  }

  requestAnimationFrame(() => {
    overlay.classList.add("show");
  });
}

function hideMilestone(){
  const overlay = document.getElementById("milestoneOverlay");
  overlay.classList.remove("show");
  overlay.classList.add("exit");
}

document.getElementById("langEnBtn").classList.toggle("active", currentLang === "en");
document.getElementById("langUaBtn").classList.toggle("active", currentLang === "ua");
applyStaticText();
startRound();
</script>
