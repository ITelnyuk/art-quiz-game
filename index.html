<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who Painted This? — An Art History Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --wall: #2E3328;
    --plaster: #F3ECDD;
    --ink: #211F1A;
    --ink-soft: #5B564A;
    --brass: #B8894F;
    --brass-light: #D6AE7B;
    --correct: #5B7553;
    --wrong: #9C4A3C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--wall);
    background-image:
      radial-gradient(ellipse at top, rgba(255,255,255,0.04), transparent 60%),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 1px, transparent 1px, transparent 120px);
    color: var(--plaster);
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
    overflow: hidden;
  }

  .layout{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 48px;
    max-width: 1100px;
    width:100%;
  }

  .left-col{
    flex: 1 1 420px;
    max-width: 460px;
    display:flex;
    flex-direction:column;
  }

  .right-col{
    flex: 0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  header{ margin-bottom: 18px; }
  h1{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(26px, 3.4vw, 38px);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .sub{ color: #C9C4B4; font-size: 14px; line-height: 1.5; margin:0; }

  .scorebar{ display:flex; gap: 28px; margin: 16px 0 20px; font-family:'Fraunces', serif; }
  .score-item{ text-align:left; }
  .score-num{ font-size: 28px; color: var(--brass-light); font-weight:600; display:block; line-height:1; }
  .score-label{ font-size: 11px; letter-spacing: 0.06em; color: #A9A490; display:block; margin-top: 4px; }

  .frame{
    background: linear-gradient(135deg, #C9A15E, #8A6A38 45%, #6B4E28);
    padding: 10px;
    border-radius: 3px;
    box-shadow: 0 14px 32px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.15);
    width: min(340px, 32vw);
  }
  .canvas-inner{ background: #12100D; padding: 6px; border-radius: 1px; }
  .art-img{
    width:100%;
    aspect-ratio: 4/5;
    max-height: 62vh;
    object-fit: cover;
    display:block;
    background: #40453A;
  }
  .art-fallback{
    width:100%;
    aspect-ratio: 4/5;
    max-height: 62vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(160deg, #565F4A, #3B4033);
    color: #E6DDC8;
    font-family:'Fraunces', serif;
    font-size: 15px;
    text-align:center;
    padding: 20px;
    line-height:1.4;
  }

  .prompt{
    font-family:'Fraunces', serif;
    font-size: 17px;
    font-style: italic;
    color: var(--brass-light);
    margin: 4px 0 14px;
    text-align:left;
  }

  .options{
    width:100%;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .option-btn{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size: 13px;
    background: var(--plaster);
    color: var(--ink);
    border: none;
    border-radius: 4px;
    padding: 12px 8px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.15s ease;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
  }
  .option-btn:hover:not(:disabled){ transform: translateY(-2px); background: #fff; }
  .option-btn:disabled{ cursor: default; }
  .option-btn.correct{ background: var(--correct); color: #fff; }
  .option-btn.wrong{ background: var(--wrong); color: #fff; }

  .result-bar{
    width:100%;
    margin-top: 16px;
    background: var(--plaster);
    color: var(--ink);
    border-radius: 4px;
    padding: 12px 16px;
    text-align:left;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    display:none;
  }
  .result-bar.show{ display:block; }
  .result-bar .verdict{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 14px;
    margin: 0 0 4px;
  }
  .result-bar .verdict.correct-text{ color: var(--correct); }
  .result-bar .verdict.wrong-text{ color: var(--wrong); }
  .result-bar .details{
    font-family:'Fraunces', serif;
    font-size: 15px;
    margin: 0;
  }
  .result-bar .year{ color: var(--brass); font-weight: 700; }
  .result-bar .location{
    font-size: 12px;
    color: var(--ink-soft);
    margin: 4px 0 0;
    font-style: italic;
  }
  .result-bar .info{
    font-size: 11px;
    color: var(--ink-soft);
    margin: 6px 0 0;
    line-height:1.4;
  }

  .continue-wrap{ margin-top: 14px; min-height: 20px; }
  button.next-btn{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size: 13px;
    background: var(--brass);
    color: #211F1A;
    border:none;
    padding: 10px 24px;
    border-radius: 3px;
    cursor:pointer;
    transition: background 0.15s ease;
  }
  button.next-btn:hover{ background: var(--brass-light); }

  footer{
    display:none;
  }

  @media (max-width: 820px){
    body{ height:auto; overflow:auto; padding: 28px 16px 48px; }
    .layout{ flex-direction: column; gap: 24px; }
    .left-col{ max-width: 420px; text-align:center; }
    .scorebar{ justify-content:center; }
    .score-item{ text-align:center; }
    .prompt{ text-align:center; }
    .frame{ width: min(320px, 78vw); }
    .art-img, .art-fallback{ max-height: none; }
  }
  @media (max-width: 480px){
    .options{ grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce){
    .option-btn{ transition:none; }
  }
</style>
</head>
<body>

<div class="layout">
  <div class="right-col">
    <div class="frame">
      <div class="canvas-inner">
        <img class="art-img" id="artImg" src="" alt="" />
        <div class="art-fallback" id="artFallback" style="display:none;"></div>
      </div>
    </div>
  </div>

  <div class="left-col">
    <header>
      <h1>Who Painted This?</h1>
      <p class="sub">One painting, four names. Pick the artist who made it.</p>
    </header>

    <div class="scorebar">
      <div class="score-item">
        <span class="score-num" id="streakNum">0</span>
        <span class="score-label">STREAK</span>
      </div>
      <div class="score-item">
        <span class="score-num" id="bestNum">0</span>
        <span class="score-label">BEST</span>
      </div>
    </div>

    <div class="prompt">Who painted this?</div>

    <div class="options" id="options"></div>

    <div class="result-bar" id="resultBar">
      <p class="verdict" id="verdict"></p>
      <p class="details"><span id="rTitle"></span> — <span class="year" id="rYear"></span></p>
      <p class="info" id="rInfo"></p>
      <p class="location" id="rLocation"></p>
    </div>

    <div class="continue-wrap" id="continueWrap"></div>
  </div>
</div>

<footer>
  Artwork years and details reflect widely documented art-historical records. Images are drawn from Wikipedia where available.
</footer>

<script>
const ARTWORKS = [
  { title:"Arnolfini Portrait", artist:"Jan van Eyck", year:1434, info:"A richly detailed double portrait long debated for the meaning of its symbolism.", location:"The National Gallery, London", image:"images/arnolfini-portrait.jpg", wikiTitle:"Arnolfini Portrait" },
  { title:"The Birth of Venus", artist:"Sandro Botticelli", year:1485, info:"Depicts the goddess Venus arriving at the shore after her birth from the sea.", location:"Uffizi Gallery, Florence", image:"images/the-birth-of-venus.jpg", wikiTitle:"The Birth of Venus" },
  { title:"The Last Supper", artist:"Leonardo da Vinci", year:1498, info:"A mural depicting the moment Jesus announces one of his disciples will betray him.", location:"Santa Maria delle Grazie, Milan", image:"images/the-last-supper.jpg", wikiTitle:"The Last Supper (Leonardo)" },
  { title:"Mona Lisa", artist:"Leonardo da Vinci", year:1503, info:"Likely a portrait of Lisa Gherardini, wife of a Florentine merchant.", location:"The Louvre, Paris", image:"images/mona-lisa.jpg", wikiTitle:"Mona Lisa" },
  { title:"The School of Athens", artist:"Raphael", year:1511, info:"A fresco gathering ancient philosophers, with Plato and Aristotle at its center.", location:"Apostolic Palace, Vatican City", image:"images/the-school-of-athens.jpg", wikiTitle:"The School of Athens" },
  { title:"The Creation of Adam", artist:"Michelangelo", year:1512, info:"A fresco on the ceiling of the Sistine Chapel, one of the most referenced images in Western art.", location:"Sistine Chapel, Vatican City", image:"images/the-creation-of-adam.jpg", wikiTitle:"The Creation of Adam" },
  { title:"The Calling of Saint Matthew", artist:"Caravaggio", year:1600, info:"Uses a dramatic beam of light to single out Matthew at the moment he is called.", location:"San Luigi dei Francesi, Rome", image:"images/the-calling-of-saint-matthew.jpg", wikiTitle:"The Calling of Saint Matthew" },
  { title:"Las Meninas", artist:"Diego Velázquez", year:1656, info:"A complex composition that plays with perspective, showing the painter at work in the Spanish court.", location:"Museo del Prado, Madrid", image:"images/las-meninas.jpg", wikiTitle:"Las Meninas" },
  { title:"The Night Watch", artist:"Rembrandt", year:1642, info:"A group portrait of a militia company, famous for its dramatic use of light and shadow.", location:"Rijksmuseum, Amsterdam", image:"images/the-night-watch.jpg", wikiTitle:"The Night Watch" },
  { title:"Girl with a Pearl Earring", artist:"Johannes Vermeer", year:1665, info:"Sometimes called the 'Mona Lisa of the North' for its enigmatic gaze.", location:"Mauritshuis, The Hague", image:"images/girl-with-a-pearl-earring.jpg", wikiTitle:"Girl with a Pearl Earring" },
  { title:"The Swing", artist:"Jean-Honoré Fragonard", year:1767, info:"A playful Rococo scene of a young woman on a swing, watched by an admirer hidden in the bushes.", location:"Wallace Collection, London", image:"images/the-swing.jpg", wikiTitle:"The Swing (Fragonard)" },
  { title:"The Raft of the Medusa", artist:"Théodore Géricault", year:1819, info:"Depicts the aftermath of a shipwreck, based on a real and controversial disaster.", location:"The Louvre, Paris", image:"images/the-raft-of-the-medusa.jpg", wikiTitle:"The Raft of the Medusa" },
  { title:"Liberty Leading the People", artist:"Eugène Delacroix", year:1830, info:"Commemorates the July Revolution of 1830 in France, with Liberty personified carrying the flag.", location:"The Louvre, Paris", image:"images/liberty-leading-the-people.jpg", wikiTitle:"Liberty Leading the People" },
  { title:"The Great Wave off Kanagawa", artist:"Katsushika Hokusai", year:1831, info:"A woodblock print from a series depicting Mount Fuji from different viewpoints.", location:"Held in multiple collections worldwide, incl. The Met, New York", image:"images/the-great-wave-off-kanagawa.jpg", wikiTitle:"The Great Wave off Kanagawa" },
  { title:"Olympia", artist:"Édouard Manet", year:1863, info:"A reclining nude that scandalized audiences for its confrontational, modern subject.", location:"Musée d'Orsay, Paris", image:"images/olympia.jpg", wikiTitle:"Olympia (Manet)" },
  { title:"Impression, Sunrise", artist:"Claude Monet", year:1872, info:"The painting that gave the Impressionist movement its name.", location:"Musée Marmottan Monet, Paris", image:"images/impression-sunrise.jpg", wikiTitle:"Impression, Sunrise" },
  { title:"A Sunday on La Grande Jatte", artist:"Georges Seurat", year:1886, info:"Built entirely from tiny dots of color, a landmark of the Pointillist technique.", location:"Art Institute of Chicago", image:"images/a-sunday-on-la-grande-jatte.jpg", wikiTitle:"A Sunday Afternoon on the Island of La Grande Jatte" },
  { title:"The Starry Night", artist:"Vincent van Gogh", year:1889, info:"Painted from memory at an asylum in Saint-Rémy, looking out at the view before dawn.", location:"Museum of Modern Art (MoMA), New York", image:"images/the-starry-night.jpg", wikiTitle:"The Starry Night" },
  { title:"The Scream", artist:"Edvard Munch", year:1893, info:"Munch described the inspiration as a sudden feeling passing through nature.", location:"National Museum of Norway, Oslo", image:"images/the-scream.jpg", wikiTitle:"The Scream" },
  { title:"The Kiss", artist:"Gustav Klimt", year:1908, info:"Part of Klimt's 'Golden Phase', decorated with real gold leaf.", location:"Belvedere, Vienna", image:"images/the-kiss.jpg", wikiTitle:"The Kiss (Klimt)" },
  { title:"The Persistence of Memory", artist:"Salvador Dalí", year:1931, info:"Its melting clocks have become one of the most recognizable images of Surrealism.", location:"Museum of Modern Art (MoMA), New York", image:"images/the-persistence-of-memory.jpg", wikiTitle:"The Persistence of Memory" },
  { title:"American Gothic", artist:"Grant Wood", year:1930, info:"The models were the artist's sister and his dentist, not a real married couple.", location:"Art Institute of Chicago", image:"images/american-gothic.jpg", wikiTitle:"American Gothic" },
  { title:"Guernica", artist:"Pablo Picasso", year:1937, info:"A monumental protest against the bombing of a Basque town during the Spanish Civil War.", location:"Museo Reina Sofía, Madrid", image:"images/guernica.jpg", wikiTitle:"Guernica (Picasso)" },
  { title:"Nighthawks", artist:"Edward Hopper", year:1942, info:"Depicts a late-night diner in an almost empty city street, evoking urban isolation.", location:"Art Institute of Chicago", image:"images/nighthawks.jpg", wikiTitle:"Nighthawks (painting)" },
  { title:"Christina's World", artist:"Andrew Wyeth", year:1948, info:"Shows a woman in a field looking toward a distant farmhouse, based on a neighbor with a physical disability.", location:"Museum of Modern Art (MoMA), New York", image:"images/christina-s-world.jpg", wikiTitle:"Christina's World" },
  { title:"No. 5, 1948", artist:"Jackson Pollock", year:1948, info:"An early example of Pollock's signature drip technique, built up in dense layers of paint.", location:"Private collection", image:"images/no-5-1948.jpg", wikiTitle:"No. 5, 1948" },
  { title:"The Son of Man", artist:"René Magritte", year:1964, info:"A self-portrait where the subject's face is obscured by a floating green apple.", location:"Private collection", image:"images/the-son-of-man.jpg", wikiTitle:"The Son of Man" },
  { title:"Marilyn Diptych", artist:"Andy Warhol", year:1962, info:"Repeats a single publicity photo of Marilyn Monroe in rows of fading, silkscreened color.", location:"Tate, London", image:"images/marilyn-diptych.jpg", wikiTitle:"Marilyn Diptych" },
  { title:"One: Number 31, 1950", artist:"Jackson Pollock", year:1950, info:"A large-scale drip painting made by pouring paint directly onto canvas laid on the floor.", location:"Museum of Modern Art (MoMA), New York", image:"images/one-number-31-1950.jpg", wikiTitle:"One: Number 31, 1950" },
  { title:"Woman I", artist:"Willem de Kooning", year:1952, info:"Part of a series that reimagines the female figure through aggressive, gestural brushwork.", location:"Museum of Modern Art (MoMA), New York", image:"images/woman-i.jpg", wikiTitle:"Woman I" }
];

const imageCache = {};

async function fetchWikiImage(wikiTitle){
  if(imageCache[wikiTitle] !== undefined) return imageCache[wikiTitle];
  try{
    const url = "https://en.wikipedia.org/w/api.php?origin=*&action=query&redirects=1&prop=pageimages&format=json&piprop=original%7Cthumbnail&pithumbsize=600&titles=" + encodeURIComponent(wikiTitle);
    const res = await fetch(url);
    const data = await res.json();
    const pages = data.query && data.query.pages;
    const page = pages ? Object.values(pages)[0] : null;
    let src = null;
    if(page){
      if(page.original && page.original.source) src = page.original.source;
      else if(page.thumbnail && page.thumbnail.source) src = page.thumbnail.source;
    }
    imageCache[wikiTitle] = src;
    return src;
  } catch(e){
    imageCache[wikiTitle] = null;
    return null;
  }
}

let deck = [];
let currentArt = null;
let streak = parseInt(localStorage.getItem("wpt_streak") || "0", 10);
let best = parseInt(localStorage.getItem("wpt_best") || "0", 10);
document.getElementById("streakNum").textContent = streak;
document.getElementById("bestNum").textContent = best;

function shuffledDeck(){
  const d = [...ARTWORKS];
  for(let i = d.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [d[i], d[j]] = [d[j], d[i]];
  }
  return d;
}

function drawCard(){
  if(deck.length === 0) deck = shuffledDeck();
  let card = deck.pop();
  if(card === currentArt && deck.length > 0){
    // avoid an immediate repeat when a fresh shuffle starts with the last-seen card
    deck.unshift(card);
    card = deck.pop();
  }
  return card;
}

function pickOptions(correctArt){
  const others = ARTWORKS.filter(a => a.artist !== correctArt.artist);
  for(let i = others.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [others[i], others[j]] = [others[j], others[i]];
  }
  const distractors = others.slice(0, 3).map(a => a.artist);
  const opts = [...distractors, correctArt.artist];
  for(let i = opts.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [opts[i], opts[j]] = [opts[j], opts[i]];
  }
  return opts;
}

async function startRound(){
  const thisRoundArt = drawCard();
  currentArt = thisRoundArt;
  const img = document.getElementById("artImg");
  const fallback = document.getElementById("artFallback");

  const opts = pickOptions(currentArt);
  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";
  opts.forEach(name => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.textContent = name;
    btn.onclick = () => onGuess(name, btn);
    optionsDiv.appendChild(btn);
  });

  document.getElementById("resultBar").classList.remove("show");
  document.getElementById("continueWrap").innerHTML = "";

  img.style.display = "none";
  fallback.style.display = "flex";
  fallback.innerHTML = "Loading painting…";

  const showFinal = (finalSrc) => {
    if(currentArt !== thisRoundArt) return;
    if(!finalSrc){
      fallback.innerHTML = "No image available<br><span style=\"opacity:0.7;font-size:12px\">" + thisRoundArt.title + "</span>";
      return;
    }
    img.onerror = function(){
      img.style.display = "none";
      fallback.style.display = "flex";
      fallback.innerHTML = "No image available<br><span style=\"opacity:0.7;font-size:12px\">" + thisRoundArt.title + "</span>";
    };
    img.onload = function(){
      img.style.display = "";
      fallback.style.display = "none";
    };
    img.alt = "Untitled painting to identify";
    img.src = finalSrc;
  };

  // Try the local image first — instant, no network round trip.
  const probe = new Image();
  probe.onload = () => showFinal(thisRoundArt.image);
  probe.onerror = async () => {
    if(currentArt !== thisRoundArt) return;
    const src = await fetchWikiImage(thisRoundArt.wikiTitle);
    showFinal(src);
  };
  probe.src = thisRoundArt.image;
}

function onGuess(chosenName, btnEl){
  const correct = chosenName === currentArt.artist;
  document.querySelectorAll(".option-btn").forEach(b => {
    b.disabled = true;
    if(b.textContent === currentArt.artist) b.classList.add("correct");
    else if(b === btnEl && !correct) b.classList.add("wrong");
  });

  if(correct){
    streak++;
    if(streak > best){
      best = streak;
      localStorage.setItem("wpt_best", best);
      document.getElementById("bestNum").textContent = best;
    }
  } else {
    streak = 0;
  }
  localStorage.setItem("wpt_streak", streak);
  document.getElementById("streakNum").textContent = streak;

  const verdict = document.getElementById("verdict");
  verdict.textContent = correct ? "Correct." : "Not quite.";
  verdict.className = "verdict " + (correct ? "correct-text" : "wrong-text");
  document.getElementById("rTitle").textContent = currentArt.title;
  document.getElementById("rYear").textContent = currentArt.year;
  document.getElementById("rLocation").textContent = "📍 " + currentArt.location;
  document.getElementById("rInfo").textContent = currentArt.info;
  document.getElementById("resultBar").classList.add("show");

  const btn = document.createElement("button");
  btn.className = "next-btn";
  btn.textContent = "Next painting →";
  btn.onclick = startRound;
  document.getElementById("continueWrap").innerHTML = "";
  document.getElementById("continueWrap").appendChild(btn);
}

startRound();
</script>

</body>
</html>
